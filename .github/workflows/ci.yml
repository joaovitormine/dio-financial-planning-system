name: Go CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar o Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'

      - name: Baixar dependências
        run: go mod download

      - name: Verificar formatação do código
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Arquivos fora do padrão de formatação:"
            gofmt -l .
            exit 1
          fi

      - name: Rodar testes unitários
        run: go test -v ./...

      - name: Executar golangci-lint
        uses: golangci/golangci-lint-action@v6